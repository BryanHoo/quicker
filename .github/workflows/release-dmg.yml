name: Release DMG

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve VERSION
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="manual-${GITHUB_SHA:0:7}"
          fi
          echo "VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Detect signing mode
        shell: bash
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          set -euo pipefail

          if [[ -n "${MACOS_CERTIFICATE_P12:-}" && -n "${MACOS_CERTIFICATE_PASSWORD:-}" && -n "${MACOS_TEAM_ID:-}" ]]; then
            echo "HAS_SIGNING_SECRETS=1" >> "${GITHUB_ENV}"
            echo "MACOS_TEAM_ID=${MACOS_TEAM_ID}" >> "${GITHUB_ENV}"
            echo "Using signed build mode."
          else
            echo "HAS_SIGNING_SECRETS=0" >> "${GITHUB_ENV}"
            echo "Using unsigned build mode (no signing secrets configured)."
          fi

      - name: Setup code signing keychain
        if: env.HAS_SIGNING_SECRETS == '1'
        shell: bash
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          CERT_PATH="${RUNNER_TEMP}/build_certificate.p12"
          KEYCHAIN_PATH="${RUNNER_TEMP}/build-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          if ! echo "${MACOS_CERTIFICATE_P12}" | base64 --decode > "${CERT_PATH}" 2>/dev/null; then
            echo "${MACOS_CERTIFICATE_P12}" | base64 -D > "${CERT_PATH}"
          fi

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERT_PATH}" -k "${KEYCHAIN_PATH}" -P "${MACOS_CERTIFICATE_PASSWORD}" -f pkcs12 -A -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}"
          security default-keychain -d user -s "${KEYCHAIN_PATH}"
          security find-identity -v -p codesigning "${KEYCHAIN_PATH}"

          echo "SIGNING_KEYCHAIN_PATH=${KEYCHAIN_PATH}" >> "${GITHUB_ENV}"
          echo "SIGNING_KEYCHAIN_PASSWORD=${KEYCHAIN_PASSWORD}" >> "${GITHUB_ENV}"

      - name: Build (Release, code signed)
        if: env.HAS_SIGNING_SECRETS == '1'
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project quicker.xcodeproj \
            -scheme quicker \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            DEVELOPMENT_TEAM="${MACOS_TEAM_ID}" \
            CODE_SIGN_STYLE=Automatic \
            clean build

      - name: Build (Release, no code signing)
        if: env.HAS_SIGNING_SECRETS != '1'
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project quicker.xcodeproj \
            -scheme quicker \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean build

      - name: Verify app signature
        if: env.HAS_SIGNING_SECRETS == '1'
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="build/DerivedData/Build/Products/Release/quicker.app"
          /usr/bin/codesign --verify --deep --strict "${APP_PATH}"
          /usr/bin/codesign -dv --verbose=4 "${APP_PATH}" 2>&1 | grep -E "Identifier=|TeamIdentifier=|Authority="

      - name: Unsigned build warning
        if: env.HAS_SIGNING_SECRETS != '1'
        shell: bash
        run: |
          set -euo pipefail
          echo "::warning::Building without code signing. macOS Accessibility permission may not persist across upgrades."

      - name: Package DMG
        shell: bash
        env:
          VERSION: ${{ env.VERSION }}
          REQUIRE_SIGNED_APP: ${{ env.HAS_SIGNING_SECRETS }}
        run: |
          set -euo pipefail
          bash scripts/ci/package_dmg.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quicker-${{ env.VERSION }}
          path: build/artifacts/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/artifacts/*.dmg
            build/artifacts/*.sha256
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Cleanup signing keychain
        if: always() && env.HAS_SIGNING_SECRETS == '1'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${SIGNING_KEYCHAIN_PATH:-}" && -f "${SIGNING_KEYCHAIN_PATH}" ]]; then
            security delete-keychain "${SIGNING_KEYCHAIN_PATH}" || true
          fi
